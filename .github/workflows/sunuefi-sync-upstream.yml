name: SunUEFI sync upstream

# 需求 3：定时/手动把 yzddmr6/xiaomipad-8pro-mainline 的更新同步进本 fork。
# 因为 UEFI 移植层全部位于 port/ 与 .github/workflows/sunuefi-*，与上游目录零重叠，
# 同步是纯 merge，不会冲突；合并后通过 repository_dispatch 触发 sunuefi-build.yml 重建。
on:
  schedule:
    - cron: '0 18 * * 2'   # 每周二 02:00 (UTC+8)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查更新与隔离，不合并、不推送'
        type: boolean
        default: false
      release_tag_after_sync:
        description: '[需求7] 同步成功后打此 tag 并推送（触发构建+自动发布 Release）；留空不打 tag，需 SYNC_TOKEN'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sunuefi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用 PAT 才能触发后续 build workflow（GITHUB_TOKEN 的 push 默认不触发）
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: 配置 git 身份
        run: |
          git config user.name "sunuefi-sync[bot]"
          git config user.email "sunuefi-sync[bot]@users.noreply.github.com"

      - name: 配置 upstream remote
        run: bash port/tools/port-sync-upstream.sh . --init

      - name: 检查上游更新 + 命名空间冲突预检
        id: check
        run: |
          set -euo pipefail
          git fetch --no-tags upstream main
          before=$(git rev-parse HEAD)
          after=$(git rev-parse upstream/main)
          behind=$(git rev-list --count HEAD..upstream/main || echo 0)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "落后上游 $behind 个提交"
          # 上游是否触及本 fork 自有命名空间（正常应为空）
          base=$(git merge-base HEAD upstream/main || echo '')
          touch=''
          if [ -n "$base" ]; then
            touch=$(git diff --name-only "$base" upstream/main -- 'port/**' '.github/workflows/sunuefi-*' || true)
          fi
          if [ -n "$touch" ]; then
            echo "::error::上游改动触及 port 自有命名空间，需人工处理: $touch"
            exit 1
          fi
          echo "命名空间冲突预检通过"

      - name: 合并 upstream/main（port/ 原样保留）
        if: steps.check.outputs.behind != '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git merge --no-edit upstream/main
          echo "合并完成，当前 HEAD: $(git rev-parse --short HEAD)"

      - name: 合并后隔离校验 + 离线自检
        if: steps.check.outputs.behind != '0' && inputs.dry_run != true
        run: |
          python3 port/tools/port-check-isolation.py --root . --mode tree --json
          bash port/verify-port.sh . >/dev/null && echo "离线自检通过"

      - name: 推送合并结果
        if: steps.check.outputs.behind != '0' && inputs.dry_run != true
        run: git push origin HEAD:main

      - name: 触发三产物重建
        if: steps.check.outputs.behind != '0' && inputs.dry_run != true && env.HAS_PAT == 'true'
        env:
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' && 'true' || 'false' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"upstream-synced"}' && echo "已派发 upstream-synced 事件"

      # 需求 7 可选：同步完直接打 tag，触发 sunuefi-build.yml 的 publish job 自动发布
      # 必须配 SYNC_TOKEN（PAT）：GITHUB_TOKEN 的 push 不会再触发别的 workflow。
      - name: '[可选] 打发布 tag 触发自动发布'
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.dry_run != true && inputs.release_tag_after_sync != '' &&
              steps.check.outputs.behind != '0' }}
        env:
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' && 'true' || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag_after_sync }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" != 'true' ]; then
            echo "::error::打 tag 后需要 PAT 才能触发 build/publish workflow，请在 Secrets 配置 SYNC_TOKEN"
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "SunUEFI release $RELEASE_TAG (upstream synced)"
          git push origin "$RELEASE_TAG"
          echo "已推送 $RELEASE_TAG -> 触发 sunuefi-build.yml 构建并自动发布 Release"

      - name: 汇总
        run: |
          echo "### 上游同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 合并前: \`${{ steps.check.outputs.before }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 上游 main: \`${{ steps.check.outputs.after }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 落后提交数: ${{ steps.check.outputs.behind }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- UEFI 移植层: port/ 与 sunuefi-*.yml（与上游零重叠）" >> "$GITHUB_STEP_SUMMARY"

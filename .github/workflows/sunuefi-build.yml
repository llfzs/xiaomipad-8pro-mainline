name: SunUEFI build products

# 需求 6：在 GitHub 上构建三产物 SunUEFI-Module / SunUEFI-ESP / SunUEFI-Root-<target>。
# 需求 7：把三产物发布到 GitHub Release（publish job）：
#   * push tag v*        -> 构建完成后自动发布到该 tag
#   * workflow_dispatch  -> 勾 publish_release 手动发布（可不打 tag，自动生成 port-<sha>）
#   * 另有 sunuefi-release.yml 用于「不重新编译、从已有 run 补发/重发」。
# 需求 3：UEFI 全部位于 port/ 与 .github/workflows/sunuefi-*，零上游文件修改，
#         同步上游 merge 后 push 到 main 会触发本构建；tag push 不评估 paths 过滤。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'port/**'
      - '.github/workflows/sunuefi-build.yml'
      # 上游勤快维护的目录：同步进来后自动重建
      - 'kernel/**'
      - 'device/**'
      - 'ubuntu/**'
      - 'tools/**'
      - 'firmware/**'
      - 'mesa/**'
      - 'initramfs/**'
      - 'packaging/**'
  repository_dispatch:
    types: [upstream-synced]
  workflow_dispatch:
    inputs:
      target:
        description: '发行版 target（对应 SunUEFI-Root-<target>）'
        type: choice
        options: [all, ubuntu-gnome, debian-gnome, debian-kde, nyarch-gnome, steamos]
        default: all
      full_build:
        description: '是否调用上游脚本做完整内核/rootfs 编译（需 ARM64 runner 与设备固件；否则只跑 port 层）'
        type: boolean
        default: false
      publish_release:
        description: '构建完成后把三产物发布到 GitHub Release（需求 7）'
        type: boolean
        default: false
      release_tag:
        description: '发布用 tag（留空且非 tag push 时自动生成 port-<短SHA>）'
        type: string
        default: ''
      draft:
        description: '发布为草稿（仅手动发布时生效）'
        type: boolean
        default: false
      prerelease:
        description: '标记为预发布（仅手动发布时生效）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sunuefi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 门禁：证明本 fork 只增不改，随时可同步上游（需求 3）
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 port 命名空间隔离
        run: python3 port/tools/port-check-isolation.py --root . --mode tree --json
      - name: 离线自检（桥接脚本 + payload 契约 + 账号 + 三产物 + Release 资产）
        run: bash port/verify-port.sh .

  select:
    needs: isolation
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      shared: ${{ steps.m.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open('port/config/distros.json'))
          enabled = [d['target'] for d in cfg['distros'] if d['enabled']]
          t = os.environ.get('TARGET', 'all')
          chosen = enabled if t in ('', 'all') else [t]
          print('matrix=' + json.dumps({'target': chosen}, separators=(',', ':')))
          print('shared=' + (chosen[0] if chosen else ''))
          PY

  build:
    needs: select
    # 完整编译用 ARM64 runner（对齐 SunUEFI build-products.yml）；port 层任意 runner 均可
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      SUNUEFI_TARGET: ${{ matrix.target }}
      FULL_BUILD: ${{ inputs.full_build && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: 主机工具检查
        run: |
          python3 --version
          bash port/verify-port.sh . >/dev/null && echo "port 层自检通过"

      # ---- Stage B（可选）：调用上游真实脚本产出内核四件套 + rootfs ----
      # 依赖：linux-sm8750-piano 内核源码、Ubuntu apt snapshot、专用 e2fsprogs、
      #       设备专属固件。首次建议在 self-hosted ARM64 runner 上跑通后再开启。
      - name: '[可选] 上游完整编译（内核 + rootfs）'
        if: env.FULL_BUILD == '1'
        run: |
          set -euo pipefail
          echo "调用源仓库构建链（示例接线，按上游当前脚本调整，见 port/docs/PORTING-MAP.md 第 4 节）"
          bash tools/build-kernel.sh || echo "::warning::上游内核构建需要内核源码子模块"
          python3 tools/prepare-boot-dtb.py || true
          bash tools/build-initramfs.sh || true
          mkdir -p build/port-inputs
          echo "rootfs 编译需 root+qemu-user-static+专用 mke2fs，参考 ubuntu/root-image.json"
          echo "::notice::完整编译产物应软链/复制到 build/port-inputs 供后续 port-build.sh 消费"

      # ---- Stage A（默认，GitHub 上必跑通）：port 层后处理 + 三产物打包 ----
      - name: 组装三产物（账号/挂载/ESP/打包）
        env:
          MODULE_ZIP: ${{ inputs.full_build && 'artifacts/android/SunUEFI-Piano.zip' || '' }}
        run: |
          mkdir -p artifacts/downloads
          bash port/build/port-build.sh \
            --fork "$PWD" \
            --output "$PWD/artifacts/downloads/build" \
            --target "$SUNUEFI_TARGET" \
            --module-zip "$MODULE_ZIP" \
            2>&1 | tee build-port.log || true
          test -f artifacts/downloads/build/manifest.json

      # ---- 归置为三个 upload-artifact 目录（严格对齐 SunUEFI 命名）----
      - name: 归置 SunUEFI-Module / -ESP / -Root 目录
        run: |
          set -euo pipefail
          SRC=artifacts/downloads/build
          mkdir -p out/module out/esp out/root
          [ -d "$SRC/SunUEFI-Module" ] && cp -a "$SRC/SunUEFI-Module/." out/module/ || true
          [ -d "$SRC/SunUEFI-ESP" ] && cp -a "$SRC/SunUEFI-ESP/." out/esp/ || true
          ROOT_DIR=$(find "$SRC" -maxdepth 1 -type d -name "SunUEFI-Root-*" | head -1 || true)
          [ -n "$ROOT_DIR" ] && cp -a "$ROOT_DIR/." out/root/ || true
          echo "SunUEFI-Root-$SUNUEFI_TARGET:"; ls -la out/root

      - name: '上传 SunUEFI-Module（共享）'
        if: matrix.target == needs.select.outputs.shared
        uses: actions/upload-artifact@v4
        with:
          name: SunUEFI-Module
          path: out/module/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: '上传 SunUEFI-ESP（共享）'
        if: matrix.target == needs.select.outputs.shared
        uses: actions/upload-artifact@v4
        with:
          name: SunUEFI-ESP
          path: out/esp/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      - name: '上传 SunUEFI-Root-<target>'
        uses: actions/upload-artifact@v4
        with:
          name: SunUEFI-Root-${{ matrix.target }}
          path: out/root/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-build-log-${{ matrix.target }}
          path: build-port.log
          if-no-files-found: ignore

  # ---- 需求 7：把本次构建的三产物推到 GitHub Release ----
  # 只在 tag push 或手动勾选 publish_release 时运行；其余构建只上传 Actions artifacts。
  publish:
    needs: [select, build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WANT_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft && '1' || '0' }}
      WANT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载本次构建的 SunUEFI-* 产物
        uses: actions/download-artifact@v4
        with:
          pattern: SunUEFI-*
          path: release-download
          merge-multiple: false

      - name: 生成 Release 资产（ZIP + 全局 SHA256SUMS + manifest + 说明）
        id: assets
        env:
          TAG_FROM_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          TAG_FROM_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_REF:-${TAG_FROM_INPUT:-port-$(git rev-parse --short HEAD)}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 port/tools/port-release-assets.py \
            --artifacts release-download \
            --out release-assets \
            --tag "$TAG" \
            --policy port/config/release-policy.json \
            --repo "$GH_REPO" \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --upstream-baseline "yzddmr6/xiaomipad-8pro-mainline@main" \
            --json | tee release-summary.json

      - name: 发布到 GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ steps.assets.outputs.tag }}"
          TITLE="SunUEFI for Xiaomi Pad 8 Pro - ${TAG}"
          cd release-assets
          mapfile -t FILES < upload-files.txt
          echo "待上传 ${#FILES[@]} 个文件: ${FILES[*]}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release 已存在：更新说明并覆盖同名 asset"
            gh release edit "$TAG" --repo "$GH_REPO" --notes-file RELEASE-NOTES.md
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
          else
            ARGS=(create "$TAG" "${FILES[@]}" --repo "$GH_REPO" \
                  --title "$TITLE" --notes-file RELEASE-NOTES.md)
            [ "$WANT_DRAFT" = "1" ] && ARGS+=(--draft)
            [ "$WANT_PRERELEASE" = "1" ] && ARGS+=(--prerelease)
            gh release "${ARGS[@]}"
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease

      - name: 汇总
        run: |
          TAG="${{ steps.assets.outputs.tag }}"
          echo "### Release 发布结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 链接: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 资产: SunUEFI-Module.zip / SunUEFI-ESP.zip / SunUEFI-Root-*.zip / manifest.json / SHA256SUMS / RELEASE-NOTES.md" >> "$GITHUB_STEP_SUMMARY"

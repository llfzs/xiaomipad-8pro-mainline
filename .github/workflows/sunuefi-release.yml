name: SunUEFI publish release

# 需求 7 的「补发 / 重发」通道：不重新编译内核与 rootfs。
# 从一次已成功的 sunuefi-build.yml run 下载 SunUEFI-* artifacts，
# 汇总成 Release 资产后发布到指定 tag。典型用途：
#   * 构建跑绿了，但 publish job 因权限/网络失败，需要重发；
#   * 想把某次历史构建单独发布成一个正式版本；
#   * 同一 tag 换了资产，需要 --clobber 覆盖。
# 发布门禁同样生效：若该历史 run 的产物是占位骨架，强制草稿 + 预发布。
# 该 workflow 只写 GitHub Release，不改仓库文件、不碰设备。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（必填，如 v0.10.0-port1）'
        type: string
        required: true
      run_id:
        description: '构建 run ID（留空自动取最近一次成功的 SunUEFI build products）'
        type: string
        default: ''
      draft:
        description: '发布为草稿'
        type: boolean
        default: false
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false
      allow_placeholder_release:
        description: '显式允许把占位骨架产物补发为正式版（默认 false：占位时强制草稿+预发布）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: sunuefi-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WANT_DRAFT: ${{ inputs.draft && '1' || '0' }}
      WANT_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放 runner 磁盘（root sparse 约 8GiB，分卷发布需额外空间）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android 2>/dev/null || true
          df -h .

      - name: 定位构建 run 并下载 SunUEFI-* 产物
        id: dl
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GH_REPO" \
              --workflow "sunuefi-build.yml" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId' || true)
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::找不到成功的 sunuefi-build.yml run，请在 run_id 里手动填入"
            exit 1
          fi
          echo "构建 run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          rm -rf release-download && mkdir -p release-download
          # 不加 --pattern，落盘结构天然是 release-download/<artifact-name>/
          # port-build-log-* 会被汇总脚本按前缀忽略。
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir release-download
          find release-download -maxdepth 1 -type d -printf '  %f\n' | sort

      - name: 生成 Release 资产（ZIP + 全局 SHA256SUMS + manifest + 说明）
        run: |
          set -euo pipefail
          python3 port/tools/port-release-assets.py \
            --artifacts release-download \
            --out release-assets \
            --tag "${{ inputs.tag }}" \
            --policy port/config/release-policy.json \
            --repo "$GH_REPO" \
            --run-id "${{ steps.dl.outputs.run_id }}" \
            --commit "${{ github.sha }}" \
            --json | tee release-summary.json

      - name: 应用发布门禁（占位骨架不得作为正式版）
        id: guard
        env:
          ALLOW_PLACEHOLDER: ${{ inputs.allow_placeholder_release }}
        run: |
          set -euo pipefail
          DRAFT="$WANT_DRAFT"
          PRE="$WANT_PRERELEASE"
          GSTATUS="GUARD_DISABLED"
          GMESSAGE=""
          if [ -f release-assets/release-flags.env ]; then
            # shellcheck disable=SC1091
            source release-assets/release-flags.env
            GSTATUS="${GUARD_STATUS:-GUARD_DISABLED}"
            GMESSAGE="${GUARD_MESSAGE:-}"
            if [ "${FORCE_DRAFT:-0}" = "1" ] && [ "$ALLOW_PLACEHOLDER" != "true" ]; then
              DRAFT=1
              PRE=1
              echo "::warning::发布门禁：该历史构建的产物是占位骨架，强制草稿 + 预发布"
            elif [ "${FORCE_DRAFT:-0}" = "1" ]; then
              echo "::warning::已显式勾选 allow_placeholder_release，跳过门禁降级"
            fi
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "status=$GSTATUS" >> "$GITHUB_OUTPUT"
          {
            echo "### 发布门禁"
            echo "- 状态: \`$GSTATUS\`"
            echo "- 最终草稿: \`$DRAFT\` / 预发布: \`$PRE\`"
            if [ -n "$GMESSAGE" ]; then
              echo "- 说明: $GMESSAGE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 GitHub Release
        env:
          DRAFT: ${{ steps.guard.outputs.draft }}
          PRE: ${{ steps.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          TITLE="SunUEFI for Xiaomi Pad 8 Pro - ${TAG}"
          cd release-assets
          mapfile -t FILES < upload-files.txt
          echo "待上传 ${#FILES[@]} 个文件: ${FILES[*]}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GH_REPO" --notes-file RELEASE-NOTES.md
            if [ "$DRAFT" = "1" ]; then
              gh release edit "$TAG" --repo "$GH_REPO" --draft --prerelease
            fi
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
          else
            ARGS=(create "$TAG" "${FILES[@]}" --repo "$GH_REPO" \
                  --title "$TITLE" --notes-file RELEASE-NOTES.md)
            [ "$DRAFT" = "1" ] && ARGS+=(--draft)
            [ "$PRE" = "1" ] && ARGS+=(--prerelease)
            gh release "${ARGS[@]}"
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease

      - name: 汇总
        env:
          GUARD_STATUS: ${{ steps.guard.outputs.status }}
          DRAFT: ${{ steps.guard.outputs.draft }}
        run: |
          echo "### Release 补发结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 来源构建 run: \`${{ steps.dl.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 发布门禁: \`$GUARD_STATUS\`（草稿=$DRAFT）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 链接: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
